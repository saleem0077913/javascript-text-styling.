
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Styling</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Interactive Text Styling</h1>
        <p>Change the appearance of text using JavaScript.</p>

        <textarea id="userText" placeholder="Enter your text">Welcome to JavaScript!</textarea>

        <div class="buttons">
            <button id="red">Red Color</button>
            <button id="blue">Blue Color</button>
            <button id="increase">Increase Size</button>
            <button id="decrease">Decrease Size</button>
            <button id="font">Change Font</button>
            <button id="underline">Underline</button>
            <button id="overline">Overline</button>
            <button id="strike">Line Through</button>
            <button id="bold">Bold</button>
            <button id="italic">Italic</button>
            <button id="left">Align Left</button>
            <button id="center">Align Center</button>
            <button id="right">Align Right</button>
            <button id="upper">Uppercase</button>
            <button id="lower">Lowercase</button>
            <button id="background">Change Background</button>
            <button id="mode">Dark / Light Mode</button>
            <button id="reset">Reset</button>
        </div>

        <h2>Live Preview</h2>
        <div id="textArea">
            <p id="preview">Welcome to JavaScript!</p>
        </div>
    </div>
</body>
</html>
